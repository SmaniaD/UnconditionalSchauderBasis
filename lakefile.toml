name = "UnconditionalSchauderBasis"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["UnconditionalSchauderBasis"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
autoImplicit = false

[[require]]
name = "mathlib"
